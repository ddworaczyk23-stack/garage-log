# Coast calendar feed Worker. Deploy from this folder:
#   npx wrangler login                          (once)
#   npx wrangler kv namespace create FEEDS      (once; paste the id below)
#   npx wrangler deploy
name = "coast-calendar-feed"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "FEEDS"
id = "c3100bd2678a4b0cb47c2eee165eb4c8"

# Per-IP limit on PUT/DELETE (src/index.ts). The app writes at most once per
# change (5 s debounce), so 10 a minute is plenty for real use.
[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
